{% extends "base.html" %}
{% block title %}시가 조회 포털{% endblock %}

{% block content %}
<div class="card">
  <h1>시가 조회 포털</h1>
  <p class="subtitle">토지/주택/건물 공시가격 및 시가표준액을 한곳에서 조회합니다</p>

  {% if error %}
  <div class="alert alert-error">{{ error }}</div>
  {% endif %}

  <form method="POST" action="/search" id="searchForm">
    <!-- 부동산 유형 선택 -->
    <div class="form-group">
      <label>부동산 유형</label>
      <div class="type-grid">
        {% for key, label in property_types.items() %}
        <label class="type-card" data-type="{{ key }}">
          <input type="radio" name="property_type" value="{{ key }}">
          <span class="type-icon">
            {% if key == 'land' %}&#127966;
            {% elif key == 'apartment' %}&#127970;
            {% elif key == 'house' %}&#127968;
            {% elif key == 'building' %}&#127959;
            {% elif key == 'commercial' %}&#127978;
            {% elif key == 'factory' %}&#127981;
            {% endif %}
          </span>
          <span class="type-name">{{ label.split(' (')[0] }}</span>
          <span class="type-desc">{{ label.split(' (')[1][:-1] if ' (' in label else '' }}</span>
        </label>
        {% endfor %}
      </div>
    </div>

    <!-- 주소 입력 -->
    <div class="form-group">
      <label for="addressInput">주소 입력</label>
      <div class="autocomplete-wrapper">
        <input type="text" id="addressInput" name="address"
               placeholder="주소를 입력하세요 (예: 강남구 역삼동 123-4)" autocomplete="off">
        <div class="autocomplete-list" id="autocompleteList"></div>
      </div>
      <input type="hidden" id="jusoData" name="juso_data">
      <div id="selectedAddress" style="display:none;margin-top:6px;font-size:0.85rem;color:var(--primary);font-weight:500;"></div>
    </div>

    <!-- 기준년도 -->
    <div class="form-group">
      <label for="year">기준년도</label>
      <select name="year" id="year">
        <option value="">전체</option>
        {% for y in years %}
        <option value="{{ y }}">{{ y }}년</option>
        {% endfor %}
      </select>
    </div>

    <!-- 동/호 추가 필드 (건물류) -->
    <div id="extraFields" class="extra-fields">
      <div class="form-row">
        <div class="form-group">
          <label for="dong_no">동</label>
          <input type="text" name="dong_no" id="dong_no" placeholder="선택">
        </div>
        <div class="form-group">
          <label for="ho_no">호</label>
          <input type="text" name="ho_no" id="ho_no" placeholder="선택">
        </div>
      </div>
    </div>

    <!-- ETAX 추가 필드 (서울 주택외건물) -->
    <div id="etaxFields" class="extra-fields">
      <div class="alert alert-info" style="font-size:0.85rem;">
        서울 지역 주택외건물은 <a href="/etax" style="text-decoration:underline;">ETAX 전용 페이지</a>에서 더 정확하게 조회할 수 있습니다.
      </div>
    </div>

    <button type="submit" class="btn btn-primary">
      <span class="btn-text">조회하기</span>
      <span class="spinner"></span>
    </button>
  </form>
</div>
{% endblock %}
